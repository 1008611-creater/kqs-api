name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          govulncheck -format=json ./... > govulncheck.json
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ] && [ ! -s govulncheck.json ]; then
            echo "govulncheck failed without producing JSON output"
            echo "::error title=govulncheck failed::exit=${scan_exit} with empty JSON output; check module downloads and proxy availability"
            exit "$scan_exit"
          fi
          if [ "$scan_exit" -ne 0 ]; then
            echo "::notice title=govulncheck exit::govulncheck exited ${scan_exit} but produced JSON; parsing findings"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          findings = []
          for line in Path("govulncheck.json").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              # govulncheck emits an `osv` event for both actionable findings
              # and informational vulnerabilities with no reachable call stack.
              # Only events carrying `finding` affect the security gate.
              finding = event.get("finding")
              osv = event.get("osv")
              if isinstance(finding, dict) and isinstance(finding.get("osv"), str):
                  findings.append((finding["osv"], event))
              elif osv and finding:
                  findings.append((str(osv), event))

          unique = {}
          for osv, event in findings:
              unique.setdefault(osv, []).append(event)
          if unique:
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              summary = Path(summary_path) if summary_path else None
              if summary:
                  with summary.open("a", encoding="utf-8") as out:
                      out.write("## Confirmed govulncheck vulnerabilities\n\n")
                      for osv in sorted(unique):
                          out.write(f"- `{osv}`\n")
              print("Confirmed govulncheck vulnerabilities:")
              for osv, events in sorted(unique.items()):
                  print(f"  {osv}")
                  # Annotations are readable without an authenticated artifact
                  # download; the step log alone is not enough for public triage.
                  print(f"::error title=Confirmed govulncheck vulnerability::{osv}")
                  for event in events[:3]:
                      if event.get("finding"):
                          print(f"    finding: {json.dumps(event['finding'], sort_keys=True)}")
                      if event.get("trace"):
                          print(f"    trace: {json.dumps(event['trace'], sort_keys=True)}")
              raise SystemExit(1)

          print("govulncheck found no vulnerability records; informational call traces are not treated as findings.")
          PY
          rm -f govulncheck.json

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
