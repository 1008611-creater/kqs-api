name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Compile embedded production binary
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath -o tmp/sub2api-ci ./cmd/server
          grep -a -q '<html' tmp/sub2api-ci

      - name: Run release-critical tests
        working-directory: backend
        run: |
          go test -tags unit ./internal/service -run '^TestNextInterval_' -count=1
          go test ./internal/service ./internal/handler -run '^$' -count=1
