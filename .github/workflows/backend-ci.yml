name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Publish unit test failure summary
        if: failure()
        working-directory: backend
        run: |
          {
            echo '## Unit test failure evidence'
            echo '```text'
            tail -n 240 unit-test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also expose the actionable lines as check-run annotations. Public
          # check-run metadata includes annotations, while job summaries and
          # artifacts may require authenticated access to read.
          #
          # Only real test/build failures are emitted here. A generic "Error:"
          # match would capture expected error logs printed by passing tests and
          # push the real "--- FAIL:" lines out of the annotation window.
          grep -E '^(--- FAIL:|FAIL[[:space:]]|panic:|.*undefined:|.*cannot |.*no required module)' unit-test.log \
            | head -n 60 \
            | while IFS= read -r line; do
                escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
                echo "::error file=backend/Makefile,line=18::${escaped}"
              done || true
      - name: Upload unit test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-${{ github.run_id }}
          path: backend/unit-test.log
          if-no-files-found: warn
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
